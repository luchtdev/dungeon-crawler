<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Neon Dış Işıma -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ff0055" flood-opacity="0.8"/>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00d4ff" flood-opacity="0.9"/>
    </filter>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffcc00" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Arka Plan & Dış Neon Kenarlık -->
  <rect x="24" y="24" width="464" height="464" rx="40" fill="#0d0f17" stroke="#ff0055" stroke-width="16" filter="url(#neon-glow)" />

  <!-- CRT Scanline Çizgileri -->
  <g opacity="0.15">
    <line x1="24" y1="64" x2="488" y2="64" stroke="#ffffff" stroke-width="4" />
    <line x1="24" y1="128" x2="488" y2="128" stroke="#ffffff" stroke-width="4" />
    <line x1="24" y1="192" x2="488" y2="192" stroke="#ffffff" stroke-width="4" />
    <line x1="24" y1="256" x2="488" y2="256" stroke="#ffffff" stroke-width="4" />
    <line x1="24" y1="320" x2="488" y2="320" stroke="#ffffff" stroke-width="4" />
    <line x1="24" y1="384" x2="488" y2="384" stroke="#ffffff" stroke-width="4" />
    <line x1="24" y1="448" x2="488" y2="448" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Çapraz Neon Kılıç (Arka Katman) -->
  <g filter="url(#gold-glow)">
    <!-- Kılıç Ucu ve Namlu -->
    <path d="M120 392 L360 152 L384 128 L384 160 L352 192 L144 400 Z" fill="#e5f5ff" />
    <path d="M144 368 L360 152 L368 160 L152 376 Z" fill="#00d4ff" />
    <!-- Balçak (Guard) -->
    <rect x="110" y="370" width="60" height="20" rx="4" transform="rotate(-45 140 380)" fill="#ffcc00" stroke="#8a6700" stroke-width="4" />
    <!-- Kabza & Topuz -->
    <rect x="90" y="420" width="16" height="32" transform="rotate(-45 98 436)" fill="#732e18" />
    <circle cx="85" cy="450" r="14" fill="#ffcc00" />
  </g>

  <!-- Şövalye Miğferi (Piksel Blokları) -->
  <!-- Miğfer Gövdesi -->
  <path d="M210 140 H330 V200 H360 V290 H340 V360 H200 V290 H180 V200 H210 Z" fill="#2a2e3d" stroke="#48536c" stroke-width="8" />
  
  <!-- Miğfer Tepe İbiği (Neon Magenta Detay) -->
  <rect x="256" y="105" width="28" height="45" fill="#ff0055" filter="url(#neon-glow)" />
  <rect x="248" y="125" width="44" height="20" fill="#ff3377" />

  <!-- Yüz Siperliği & Zırh Çizgileri -->
  <rect x="200" y="210" width="140" height="70" fill="#141721" />
  
  <!-- Neon Göz / Vizör Parlaması -->
  <g filter="url(#cyan-glow)">
    <rect x="215" y="235" width="45" height="14" fill="#00d4ff" />
    <rect x="280" y="235" width="45" height="14" fill="#00d4ff" />
    <rect x="225" y="239" width="25" height="6" fill="#ffffff" />
    <rect x="290" y="239" width="25" height="6" fill="#ffffff" />
  </g>

  <!-- Havalandırma Yuvaları (Ağız Izgarası) -->
  <rect x="235" y="305" width="10" height="24" fill="#0d0f17" />
  <rect x="255" y="305" width="10" height="24" fill="#0d0f17" />
  <rect x="275" y="305" width="10" height="24" fill="#0d0f17" />
  <rect x="295" y="305" width="10" height="24" fill="#0d0f17" />
</svg>
